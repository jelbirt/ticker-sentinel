name: weekly-refresh
on:
  schedule:
    # Sat 12:00 UTC: after the Saturday daily report (10:00 UTC) and its
    # run-history commit land, so the digest covers the full Tue-Sat week.
    - cron: "0 12 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# serialize runs: an overlapping dispatch + cron pair would both count the
# label before either issue exists and mint the same refresh number twice
concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      # known limitation: the count drifts if a digest issue is deleted or the
      # label is applied elsewhere; the number is cosmetic except that the
      # calibration checklist keys off it (see sentinel/digest.py)
      - name: refresh number (prior digest issues + 1)
        id: seq
        run: |
          prior=$(gh issue list --repo "$GITHUB_REPOSITORY" --label watchlist-refresh \
            --state all --limit 500 --json number --jq length)
          echo "n=$(( prior + 1 ))" >> "$GITHUB_OUTPUT"
      - name: build digest from committed run history
        run: python -m sentinel.digest --refresh-number "${{ steps.seq.outputs.n }}" --out digest.md
      - name: open the refresh issue (assignment notifies the owner)
        run: |
          gh label create watchlist-refresh --repo "$GITHUB_REPOSITORY" --force \
            --color 1d76db --description "Weekly watchlist candidate refresh"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Watchlist candidate refresh #${{ steps.seq.outputs.n }}: week of $(date -u +%F)" \
            --body-file digest.md \
            --label watchlist-refresh \
            --assignee "${{ github.repository_owner }}"
      - name: alert on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # same alert channel as daily-report (one run-failure label, one open
          # issue): every gh call here is best-effort, because a label or
          # assignee problem must not swallow the only signal this run went red
          gh label create run-failure --repo "$GITHUB_REPOSITORY" --force \
            --color b60205 --description "Automated run failure" || true
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n' \
            "The weekly-refresh run failed." \
            "" \
            "- Run: $run_url" \
            "- Event: $GITHUB_EVENT_NAME" \
            "- Time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" \
            "" \
            "Impact: no watchlist-refresh digest issue was opened this week, so the rotation reminder and its evidence summary are missing. Nothing else is affected: the digest is pure aggregation over committed run history, so re-running this workflow (workflow_dispatch) rebuilds the same week once the cause is fixed.")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label run-failure \
            --state open --limit 1 --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            if gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"; then
              exit 0
            fi
            echo "comment on issue #$existing failed, opening a new issue instead"
          fi
          title="Weekly refresh run failure ($(date -u +%F))"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" \
            --label run-failure --assignee "$OWNER" \
          || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" \
            --label run-failure
