name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      # -c constraints.txt: the committed pin set, so CI resolves the same
      # transitive versions the scheduled runs get (see constraints.txt)
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      # No extra checks here: shell syntax is part of checks.sh, so the local
      # bar and the CI bar stay the same one script.
      - name: green bar (same script the local commit guard runs)
        run: scripts/checks.sh
