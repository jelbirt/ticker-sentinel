name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - name: shell syntax over generated scripts
        run: bash -n scripts/*.sh .claude/hooks/*.sh
      - name: green bar (same script the local commit guard runs)
        run: scripts/checks.sh
