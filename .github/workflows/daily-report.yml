name: daily-report
on:
  schedule:
    # 10:00 UTC = 6:00am EDT / 5:00am EST — pre-market briefing on the prior
    # session's close. Tue–Sat so Friday's session arrives Saturday morning.
    - cron: "0 10 * * 2-6"
  workflow_dispatch:
    inputs:
      tickers: {description: "Optional comma-separated override", required: false}
      send_email: {description: "Send email?", type: boolean, default: true}
      deep: {description: "Deep-dive mode (more history/detail)", type: boolean, default: false}

permissions:
  contents: write   # weekly fundamentals-cache commit

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # subscription auth for the llm-brief news style (claude setup-token);
      # absent -> the install step is skipped and the style fails open to headlines
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - name: install Claude Code CLI (LLM news style)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code
      - run: python -m sentinel.run ${{ inputs.tickers && format('--tickers {0}', inputs.tickers) || '' }} ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == false && '--no-email' || '' }} ${{ inputs.deep && '--deep' || '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: {name: report, path: reports/}
      - name: refresh fundamentals cache commit (weekly)
        if: github.event_name == 'schedule'
        run: |
          git config user.name sentinel-bot && git config user.email bot@users.noreply.github.com
          git add data/cache
          git diff --cached --quiet || { git commit -m "cache: refresh fundamentals" && git push; }
