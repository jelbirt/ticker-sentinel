[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticker-sentinel"
version = "0.1.0"
description = "Personal Rule-of-40 stock scorecard and daily email report"
requires-python = ">=3.12"
dependencies = [
    "yfinance==1.5.1",  # pinned: statement row labels drift between versions
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tenacity>=8.3",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = [
    "report/templates/*.j2",
    "fixtures/*.json",
    "fixtures/state/*.json",   # --dry-run change-detection history fixture
]

[tool.pytest.ini_options]
testpaths = ["tests"]
