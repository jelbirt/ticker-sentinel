recipients:            # actual addresses live in secrets; these are labels
  - primary
  - secondary
universe:
  - ticker: CRWD
    tags: [software, r40]
  - ticker: DDOG
    tags: [software, r40]
  - ticker: SNOW
    tags: [software, r40]
  - ticker: NET
    tags: [software, r40]
  - ticker: ZS
    tags: [software, r40]
  - ticker: MDB
    tags: [software, r40]
  - ticker: TEAM
    tags: [software, r40]
  - ticker: PANW
    tags: [software, r40]
benchmark: SPY
report:
  top_n: 10
  bottom_n: 4   # weak-performers table always gets this many names; with 8 tickers that's a 4/4 split
  timezone: America/New_York
  ranking: breadth   # breadth = most R40 variants ≥ 40 first, score as tiebreak; or: score
scoring:               # weights, overridable without code changes
  fundamentals_weight: 0.6
  technicals_weight: 0.4
changes:                 # day-over-day change detection (defaults shown; all optional)
  retention_runs: 12     # runs kept in data/cache/run_history.json (bot-committed)
  week_window_runs: 5    # "week" lookback in runs (Tue-Sat cadence)
  score_delta_pts: 3.0   # composite move worth reporting (0-100 scale)
  rank_delta: 2          # rank move worth reporting
  revision_swing: 3      # net 30d analyst-revision swing worth reporting
  short_delta: 0.05      # short-interest fractional change worth reporting
  week_drop_pts: 5.0     # week-window composite drop counting as deterioration
  revision_cut: 2        # net downward revisions counting as deterioration
  min_signals: 2         # negative signals needed for the Deterioration watch
  deteriorating_r40_trend: -0.10  # R40 trend below this = deteriorating (plan section 6)
news:
  feeds:               # general feeds — every entry text-matched to your tickers
    - https://www.cnbc.com/id/100003114/device/rss/rss.html          # CNBC Top Business
    - https://feeds.content.dowjones.io/public/rss/mw_topstories     # MarketWatch Top Stories
  # per-ticker feed template ({ticker} is expanded per watchlist name; entries pre-attributed)
  per_ticker_feed: "https://feeds.finance.yahoo.com/rss/2.0/headline?s={ticker}&region=US&lang=en-US"
  max_age_hours: 36    # ignore anything older
  max_per_ticker: 3    # pipeline cap; the style may show fewer
  # presentation: headlines | brief | llm-brief (see src/sentinel/news/styles.py)
  # llm-brief needs the CLAUDE_CODE_OAUTH_TOKEN secret; it fails open to headlines
  style: llm-brief
  model: claude-sonnet-5   # only used by LLM styles
  # LLM voices — one clearly-labeled section per tone, all in the same email,
  # rendered in list order (barrons leads by owner preference):
  # neutral-analyst | skeptic | brief-wire | morning-brew | barrons
  tones: [barrons, neutral-analyst, skeptic, brief-wire, morning-brew]
